[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "endolexis"
version = "0.1.0"
description = "Olvasó: an entity that reads itself through its outside. Engine and experiments of the Endolexis theory."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Attila Csiki" }]
dependencies = ["numpy>=1.21"]
keywords = ["consciousness", "interoception", "self-model", "simulation", "artificial life", "predictive processing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
lab = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://readingourselves.com"
Source = "https://github.com/csikiati/endolexis"

[project.scripts]
endolexis = "endolexis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
endolexis = ["reference/*.json"]
